<!--
  Supabase → Authentication → Emails → "Confirm signup".

  Identical body to magic-link.html, on purpose.

  AuthPanel calls signInWithOtp with shouldCreateUser: true, so a first-time
  address is created and signed in by the same tap. Which template GoTrue picks
  for that first send depends on its internal branch between signup confirmation
  and magic link, and "Confirm email" being off is supposed to settle it. Rather
  than bet on reading that branch correctly, both templates carry {{ .Token }}.
  Then she gets a code whichever one fires.

  If this file and magic-link.html ever diverge, that is the bug.
-->
<p>Your code is <strong>{{ .Token }}</strong></p>
<p>Type it into the app. It only works once, so ask for a new one if it stops working.</p>
<p>If you didn't ask for a code, you can ignore this.</p>
